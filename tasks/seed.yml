---
# Monta a ISO de autoinstall: baixa a ISO oficial do Ubuntu Server, extrai,
# injeta o seed NoCloud (user-data/meta-data) e acrescenta `autoinstall` na
# linha de comando do kernel no grub.cfg — sem esse parâmetro o instalador para
# num prompt pedindo confirmação antes de mexer no disco.
- name: Seed | Set dynamic vars
  set_fact:
    iso_name: "{{ vm_iso if (vm_iso | default('')) != '' else (vm_iso_url | urlsplit('path') | basename) }}"
    cache_dir: "{{ iso_cache_dir | default('iso_cache') }}"
    # Nomes de arquivo/diretório saem do slug, não do vm_name: nome de VM aceita
    # espaço e acento, que quebram os comandos do xorriso e o caminho no datastore.
    vm_slug: "{{ (vm_hostname | default(vm_name)) | regex_replace('[^A-Za-z0-9._-]+', '-') | regex_replace('^-+|-+$', '') | lower }}"

- name: Seed | Set derived paths
  set_fact:
    iso_src: "{{ cache_dir }}/{{ iso_name }}"
    build_dir: "build/{{ vm_slug }}"
    iso_root: "build/{{ vm_slug }}/iso_root"
    opts_file: "build/{{ vm_slug }}/mkisofs_opts.txt"
    autoinstall_iso: "{{ vm_slug }}-autoinstall.iso"

- name: Seed | Create local directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
  loop:
    - '{{ cache_dir }}'
    - '{{ build_dir }}'
  delegate_to: localhost

- name: Seed | Download the Ubuntu Server ISO
  ansible.builtin.get_url:
    url: '{{ vm_iso_url }}'
    dest: '{{ iso_src }}'
    timeout: 120
  delegate_to: localhost
  when: vm_iso_url | default('') != ''

- name: Seed | Check the source ISO
  ansible.builtin.stat:
    path: '{{ iso_src }}'
  register: iso_stat
  delegate_to: localhost

- name: Seed | Fail when the source ISO is missing
  ansible.builtin.fail:
    msg: 'ISO não encontrada em {{ iso_src }} — informe vm_iso_url ou deixe o arquivo no cache.'
  when: not iso_stat.stat.exists

- name: Seed | Extract the ISO
  ansible.builtin.shell: |
    set -e
    rm -rf "{{ iso_root }}"
    xorriso -osirrox on -indev "{{ iso_src }}" -extract / "{{ iso_root }}"
    chmod -R u+w "{{ iso_root }}"
  args:
    creates: '{{ iso_root }}/boot/grub/grub.cfg'
  delegate_to: localhost

- name: Seed | Create the nocloud directory
  ansible.builtin.file:
    path: '{{ iso_root }}/nocloud'
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Seed | Render the autoinstall seed
  ansible.builtin.template:
    src: '../templates/{{ item }}.j2'
    dest: '{{ iso_root }}/nocloud/{{ item }}'
    mode: '0644'
  loop:
    - user-data
    - meta-data
  delegate_to: localhost

- name: Seed | Add autoinstall to the kernel command line
  ansible.builtin.replace:
    path: '{{ iso_root }}/boot/grub/grub.cfg'
    # Os parâmetros entram ANTES do '---' (o que vem depois é do kernel/init).
    # O ';' vai escapado porque no grub ele separa comandos.
    regexp: '^(?!.*autoinstall)(\s*linux\s+/casper/vmlinuz.*?)(---.*)$'
    replace: '\1autoinstall ds=nocloud\;s=/cdrom/nocloud/ \2'
  delegate_to: localhost

- name: Seed | Shorten the GRUB menu timeout
  ansible.builtin.replace:
    path: '{{ iso_root }}/boot/grub/grub.cfg'
    regexp: '^set timeout=.*$'
    replace: 'set timeout=3'
  delegate_to: localhost

- name: Seed | Read the original volume id
  ansible.builtin.shell: |
    set -e
    xorriso -indev "{{ iso_src }}" -pvd_info 2>/dev/null \
      | sed -n 's/^Volume Id *: *//p' | head -n1
  register: iso_label
  changed_when: false
  delegate_to: localhost

# O próprio xorriso devolve as opções com que a ISO original foi gerada
# (-report_el_torito as_mkisofs): volume id, El Torito BIOS, a partição EFI e a
# system area. É o único jeito de regravar sem perder boot — a partir do 24.04 o
# boot_hybrid.img não existe como arquivo dentro da ISO, ele mora na system area,
# então referenciá-lo pelo caminho extraído falha.
- name: Seed | Read the original mkisofs options
  ansible.builtin.shell: |
    xorriso -indev "{{ iso_src }}" -report_el_torito as_mkisofs 2>/dev/null \
      | grep -v '^ *#' > "{{ opts_file }}" || true
  register: mkisofs_opts
  changed_when: false
  delegate_to: localhost

- name: Seed | Check the reported options
  ansible.builtin.shell: |
    test -s "{{ opts_file }}" && grep -q -- '-b ' "{{ opts_file }}"
  register: opts_ok
  changed_when: false
  failed_when: false
  delegate_to: localhost

# O volume id precisa ser preservado: o casper procura o sistema live pelo
# rótulo do CD, e uma ISO regravada com outro nome não sobe.
- name: Seed | Build the autoinstall ISO
  ansible.builtin.shell: |
    set -e
    rm -f "{{ autoinstall_iso }}"
    {% if opts_ok.rc == 0 %}
    # Reaproveita as opções da ISO original (BIOS + UEFI). O eval é necessário
    # porque elas vêm com aspas; os caminhos vão requotados por dentro.
    eval xorriso -as mkisofs $(cat "{{ opts_file }}") \
      -o "'{{ autoinstall_iso }}'" "'{{ iso_root }}'"
    {% else %}
    # Sem o relatório: El Torito BIOS apenas — suficiente para a VM, que é
    # criada com boot_firmware bios e boota do CD virtual.
    xorriso -as mkisofs -r -V "{{ iso_label.stdout | trim | default('Ubuntu-Server', true) }}" \
      -J -l \
      -b boot/grub/i386-pc/eltorito.img \
      -c boot.catalog \
      -no-emul-boot -boot-load-size 4 -boot-info-table \
      --grub2-boot-info \
      -o "{{ autoinstall_iso }}" \
      "{{ iso_root }}"
    {% endif %}
  delegate_to: localhost

- name: Seed | Check the generated ISO
  ansible.builtin.stat:
    path: '{{ autoinstall_iso }}'
  register: autoinstall_iso_stat
  delegate_to: localhost

- name: Seed | Fail when the ISO was not generated
  ansible.builtin.fail:
    msg: 'A ISO de autoinstall não foi gerada ({{ autoinstall_iso }}).'
  when: not autoinstall_iso_stat.stat.exists

- debug:
    msg: 'ISO de autoinstall pronta: {{ autoinstall_iso }} ({{ (autoinstall_iso_stat.stat.size / 1024 / 1024) | round | int }} MB)'
