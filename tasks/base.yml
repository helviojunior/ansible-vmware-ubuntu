---
# Dependências do controller (a máquina que roda o ansible).
#
# Os módulos community.vmware rodam no python do ansible (ansible_playbook_python),
# que não é necessariamente o mesmo onde o pyvmomi foi instalado — num container
# com ansible do apt e pyvmomi no python do app, por exemplo, o módulo falha com
# "Failed to import the required Python library (PyVmomi)".
- name: Base | Check the controller python packages
  ansible.builtin.command: '{{ ansible_playbook_python }} -c "import pyVmomi, jmespath"'
  register: controller_deps
  changed_when: false
  failed_when: false
  delegate_to: localhost

# pyvmomi vem do fork do helviojunior por causa do fix da limitação de licença
# free do ESXi. O --break-system-packages cobre o PEP 668 (Debian 12+); pip
# antigo não conhece a flag, daí a segunda tentativa.
- name: Base | Install the controller python packages
  ansible.builtin.shell: |
    set -e
    PY="{{ ansible_playbook_python }}"
    PKGS="git+https://github.com/helviojunior/pyvmomi jmespath netaddr requests"
    $PY -m pip install --no-cache-dir $PKGS \
      || $PY -m pip install --no-cache-dir --break-system-packages $PKGS
  delegate_to: localhost
  when: controller_deps.rc != 0 or (install_controller_deps | default(false) | bool)

- name: Base | Check required variables
  ansible.builtin.assert:
    that:
      - vcenter_login | default('') != ''
      - vcenter_password | default('') != ''
      - vm_name | default('') != ''
      - vm_username | default('') != ''
      - vm_iso_url | default('') != '' or vm_iso | default('') != ''
    fail_msg: >-
      Informe ao menos vcenter_login, vcenter_password, vm_name, vm_username e
      a ISO (vm_iso_url ou vm_iso). Veja o vars_sample.yml.

- name: Base | Warn when no SSH public key was provided
  ansible.builtin.debug:
    msg: >-
      ATENÇÃO: vm_ssh_public_key está vazio — a VM ficará acessível apenas por
      senha e a automação posterior (ansible por chave) não vai funcionar.
  when: vm_ssh_public_key | default('') == ''

- name: Base | Locate the ISO authoring tool
  ansible.builtin.command: 'sh -c "command -v xorriso || true"'
  register: xorriso_bin
  changed_when: false
  delegate_to: localhost

- name: Base | Check the ISO authoring tool
  ansible.builtin.fail:
    msg: >-
      xorriso não encontrado no controller. Ele é necessário para extrair a ISO
      do Ubuntu e regravá-la com o seed do autoinstall.
      Instale com: apt-get install -y xorriso  (Debian/Ubuntu)
      ou: brew install xorriso  (macOS).
  when: xorriso_bin.stdout | trim == ''
